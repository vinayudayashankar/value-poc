name: Build and Push to JFrog Artifactory

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JFROG_URL: https://valeodemo.jfrog.io
  DOCKER_REGISTRY: valeodemo.jfrog.io
  DOCKER_REPO: valeo-jarvis-docker-images
  ARTIFACT_REPO: valeo-jarvis-application-bundles
  API_IMAGE_NAME: jarvis-api
  UI_IMAGE_NAME: jarvis-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # GENERATE SEMANTIC VERSION (V.X.Y.Z)
      # ============================================
      - name: Determine Semantic Version
        id: version
        run: |
          BASE_VER=$(cat VERSION 2>/dev/null || echo "1.0.0")
          SEMVER="V.${BASE_VER}"
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          
          echo "Semantic Version: ${SEMVER}"
          echo "Full Image Tags:"
          echo "  API: valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${SEMVER}"
          echo "  UI:  valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${SEMVER}"

      # ============================================
      # ENSURE REPOSITORIES EXIST IN JFROG
      # ============================================
      - name: Ensure Docker repository exists
        run: |
          echo "Checking if Docker repository '${{ env.DOCKER_REPO }}' exists..."
          GET_FILE=$(mktemp)
          HTTP_GET=$(curl -s -w "%{http_code}" -o "$GET_FILE" \
            -u "${{ secrets.JFROG_USER }}:${{ secrets.JFROG_PASSWORD }}" \
            -H "Accept: application/json" \
            "https://valeodemo.jfrog.io/artifactory/api/repositories/${{ env.DOCKER_REPO }}")
          GET_BODY=$(cat "$GET_FILE")
          rm -f "$GET_FILE"
          
          echo "GET HTTP Status: $HTTP_GET"
          echo "GET Response Body: $GET_BODY"
          
          if [ "$HTTP_GET" = "200" ]; then
            echo "✅ Docker repository '${{ env.DOCKER_REPO }}' already exists."
          else
            echo "Repository '${{ env.DOCKER_REPO }}' not verified (HTTP $HTTP_GET). Attempting PUT creation..."
            
            PUT_FILE=$(mktemp)
            HTTP_PUT=$(curl -s -w "%{http_code}" -o "$PUT_FILE" -X PUT \
              "https://valeodemo.jfrog.io/artifactory/api/repositories/${{ env.DOCKER_REPO }}" \
              -u "${{ secrets.JFROG_USER }}:${{ secrets.JFROG_PASSWORD }}" \
              -H "Content-Type: application/json" \
              -d '{"key": "${{ env.DOCKER_REPO }}", "rclass": "local", "packageType": "docker", "dockerApiVersion": "V2", "repoLayoutRef": "simple-default"}')
            PUT_BODY=$(cat "$PUT_FILE")
            rm -f "$PUT_FILE"
            
            echo "PUT HTTP Status: $HTTP_PUT"
            echo "PUT Response Body: $PUT_BODY"
            
            if [ "$HTTP_PUT" = "200" ] || [ "$HTTP_PUT" = "201" ]; then
              echo "✅ Docker repository '${{ env.DOCKER_REPO }}' created successfully!"
            elif [[ "$PUT_BODY" == *"already exists"* ]]; then
              echo "✅ Docker repository '${{ env.DOCKER_REPO }}' already exists."
            else
              echo "⚠️ Creation returned HTTP $HTTP_PUT: $PUT_BODY"
            fi
          fi

      - name: Ensure Generic repository exists
        run: |
          echo "Checking if Generic repository '${{ env.ARTIFACT_REPO }}' exists..."
          GET_FILE=$(mktemp)
          HTTP_GET=$(curl -s -w "%{http_code}" -o "$GET_FILE" \
            -u "${{ secrets.JFROG_USER }}:${{ secrets.JFROG_PASSWORD }}" \
            -H "Accept: application/json" \
            "https://valeodemo.jfrog.io/artifactory/api/repositories/${{ env.ARTIFACT_REPO }}")
          GET_BODY=$(cat "$GET_FILE")
          rm -f "$GET_FILE"
          
          echo "GET HTTP Status: $HTTP_GET"
          echo "GET Response Body: $GET_BODY"
          
          if [ "$HTTP_GET" = "200" ]; then
            echo "✅ Generic repository '${{ env.ARTIFACT_REPO }}' already exists."
          else
            echo "Repository '${{ env.ARTIFACT_REPO }}' not verified (HTTP $HTTP_GET). Attempting PUT creation..."
            
            PUT_FILE=$(mktemp)
            HTTP_PUT=$(curl -s -w "%{http_code}" -o "$PUT_FILE" -X PUT \
              "https://valeodemo.jfrog.io/artifactory/api/repositories/${{ env.ARTIFACT_REPO }}" \
              -u "${{ secrets.JFROG_USER }}:${{ secrets.JFROG_PASSWORD }}" \
              -H "Content-Type: application/json" \
              -d '{"key": "${{ env.ARTIFACT_REPO }}", "rclass": "local", "packageType": "generic", "repoLayoutRef": "simple-default"}')
            PUT_BODY=$(cat "$PUT_FILE")
            rm -f "$PUT_FILE"
            
            echo "PUT HTTP Status: $HTTP_PUT"
            echo "PUT Response Body: $PUT_BODY"
            
            if [ "$HTTP_PUT" = "200" ] || [ "$HTTP_PUT" = "201" ]; then
              echo "✅ Generic repository '${{ env.ARTIFACT_REPO }}' created successfully!"
            elif [[ "$PUT_BODY" == *"already exists"* ]]; then
              echo "✅ Generic repository '${{ env.ARTIFACT_REPO }}' already exists."
            else
              echo "⚠️ Creation returned HTTP $HTTP_PUT: $PUT_BODY"
            fi
          fi

      # ============================================
      # DOCKER LOGIN
      # ============================================
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.JFROG_USER }}" ]; then
            echo "JFROG_USER is EMPTY"
            exit 1
          fi
          if [ -z "${{ secrets.JFROG_PASSWORD }}" ]; then
            echo "JFROG_PASSWORD is EMPTY"
            exit 1
          fi
          echo "Both secrets exist"

      - name: Docker Login to JFrog
        uses: docker/login-action@v3
        with:
          registry: valeodemo.jfrog.io
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_PASSWORD }}

      # ============================================
      # BUILD & PUSH DOCKER IMAGES (ONLY SEMANTIC TAG)
      # ============================================
      - name: Build and Push jarvis-api image
        run: |
          SEMVER="${{ steps.version.outputs.version }}"
          docker build \
            -f ./src/Jarvis.Traceability.Api/Dockerfile \
            -t valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${SEMVER} \
            ./src/Jarvis.Traceability.Api

          docker push valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${SEMVER}

      - name: Build and Push jarvis-ui image
        run: |
          SEMVER="${{ steps.version.outputs.version }}"
          docker build \
            -f ./frontend/Dockerfile \
            -t valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${SEMVER} \
            ./frontend

          docker push valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${SEMVER}

      # ============================================
      # CREATE SINGLE ZIP BUNDLE
      # ============================================
      - name: Create release zip bundle
        run: |
          SEMVER="${{ steps.version.outputs.version }}"
          
          mkdir -p bundle/builds
          mkdir -p bundle/configs
          mkdir -p bundle/deployments/dockerfiles
          
          # 1. Builds
          cat > bundle/builds/build-info.json << EOF
          {
            "version": "${SEMVER}",
            "commit": "${{ github.sha }}",
            "short_sha": "${{ steps.version.outputs.short_sha }}",
            "timestamp": "${{ steps.version.outputs.timestamp }}",
            "build_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}",
            "images": {
              "jarvis-api": "valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${SEMVER}",
              "jarvis-ui": "valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${SEMVER}"
            }
          }
          EOF

          # 2. Configs
          cp docker-compose.yml bundle/configs/
          cat > bundle/configs/docker-compose-jfrog.yml << EOF
          version: '3.8'
          services:
            jarvis-db:
              image: postgres:17-alpine
              container_name: jarvis-postgres
              environment:
                POSTGRES_DB: jarvis_traceability
                POSTGRES_USER: jarvis_user
                POSTGRES_PASSWORD: jarvis_password
              ports:
                - "5432:5432"
              volumes:
                - pgdata:/var/lib/postgresql/data
            jarvis-api:
              image: valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${SEMVER}
              container_name: jarvis-backend-api
              ports:
                - "5000:8080"
              environment:
                - ConnectionStrings__DefaultConnection=Host=jarvis-db;Database=jarvis_traceability;Username=jarvis_user;Password=jarvis_password
              depends_on:
                - jarvis-db
            jarvis-ui:
              image: valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${SEMVER}
              container_name: jarvis-react-ui
              ports:
                - "80:80"
              depends_on:
                - jarvis-api
            jarvis-grafana:
              image: grafana/grafana:10.2.0
              container_name: jarvis-grafana-reports
              ports:
                - "3000:3000"
              volumes:
                - ./grafana/provisioning:/etc/grafana/provisioning
                - ./grafana/dashboards:/var/lib/grafana/dashboards
              depends_on:
                - jarvis-db
          volumes:
            pgdata:
          EOF

          # 3. Deployments
          cp ./src/Jarvis.Traceability.Api/Dockerfile bundle/deployments/dockerfiles/jarvis-api.Dockerfile
          cp ./frontend/Dockerfile bundle/deployments/dockerfiles/jarvis-ui.Dockerfile
          if [ -d "./grafana" ]; then
            cp -r ./grafana bundle/deployments/grafana-configs
          fi
          
          # Zip bundle directly as ${SEMVER}.zip
          cd bundle && zip -r ../${SEMVER}.zip . && cd ..

      # ============================================
      # UPLOAD ZIP TO JFROG ARTIFACTORY (UNDER VERSION FOLDER)
      # ============================================
      - name: Upload zip bundle to JFrog
        run: |
          SEMVER="${{ steps.version.outputs.version }}"
          
          curl -s -X PUT \
            "https://valeodemo.jfrog.io/artifactory/${{ env.ARTIFACT_REPO }}/jarvis/${SEMVER}/${SEMVER}.zip" \
            -u "${{ secrets.JFROG_USER }}:${{ secrets.JFROG_PASSWORD }}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${SEMVER}.zip"
          
          echo "✅ Zip bundle ${SEMVER}.zip uploaded to JFrog at jarvis/${SEMVER}/${SEMVER}.zip"

      # ============================================
      # UPDATE K8S MANIFESTS & TRACK/RELEASE.JSON IN GIT
      # ============================================
      - name: Update K8s manifests & track/release.json in GitHub
        run: |
          SEMVER="${{ steps.version.outputs.version }}"
          API_IMAGE="valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${SEMVER}"
          UI_IMAGE="valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${SEMVER}"
          
          # Update K8s manifests
          if [ -f "k8s/api/api-deployment.yaml" ]; then
            sed -i "s|image: valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/jarvis-api:.*|image: ${API_IMAGE}|g" k8s/api/api-deployment.yaml
          fi
          if [ -f "k8s/ui/ui-deployment.yaml" ]; then
            sed -i "s|image: valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/jarvis-ui:.*|image: ${UI_IMAGE}|g" k8s/ui/ui-deployment.yaml
          fi
          
          # Update track/release.json
          mkdir -p track
          if [ ! -f "track/release.json" ]; then
            echo '{"project":"jarvis-traceability","latest_version":"","history":[]}' > track/release.json
          fi
          
          python3 -c "
          import json
          with open('track/release.json', 'r') as f:
              data = json.load(f)
          data['latest_version'] = '$SEMVER'
          data['last_updated'] = '${{ steps.version.outputs.timestamp }}'
          new_entry = {
              'version': '$SEMVER',
              'timestamp': '${{ steps.version.outputs.timestamp }}',
              'git_commit': '${{ steps.version.outputs.short_sha }}',
              'build_number': '${{ github.run_number }}',
              'artifactory_bundle': '${{ env.ARTIFACT_REPO }}/jarvis/$SEMVER/$SEMVER.zip',
              'api_image': '$API_IMAGE',
              'ui_image': '$UI_IMAGE'
          }
          # Avoid duplicate entries for same version
          data['history'] = [e for e in data['history'] if e.get('version') != '$SEMVER']
          data['history'].insert(0, new_entry)
          with open('track/release.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # Commit back to GitHub
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/ track/release.json
          git commit -m "ci: release ${SEMVER} - update manifests & track/release.json" || echo "No changes to commit"
          git push

      # ============================================
      # SUMMARY
      # ============================================
      - name: Print Summary
        run: |
          SEMVER="${{ steps.version.outputs.version }}"
          echo "============================================"
          echo "✅ BUILD & DEPLOY TRIGGER COMPLETE"
          echo "============================================"
          echo "Version: ${SEMVER}"
          echo "Commit:  ${{ github.sha }}"
          echo ""
          echo "🐳 Docker Images Pushed:"
          echo "   - valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${SEMVER}"
          echo "   - valeodemo.jfrog.io/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${SEMVER}"
          echo ""
          echo "📁 Bundle Uploaded to JFrog:"
          echo "   - ${{ env.ARTIFACT_REPO }}/jarvis/${SEMVER}/${SEMVER}.zip"
          echo ""
          echo "⚙️ Release Tracker Updated:"
          echo "   - track/release.json (GitHub)"
          echo "============================================"

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-${{ steps.version.outputs.version }}
          path: bundle/
          retention-days: 30
